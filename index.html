<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeStream Fire TV</title>
    <style>
        :root {
            --primary-blue: #00a8e1;
            --accent-glow: rgba(0, 168, 225, 0.4);
            --bg-dark: #0a0a0c;
            --card-bg: rgba(25, 25, 35, 0.85);
        }

        body {
            background: linear-gradient(to bottom, rgba(10, 10, 15, 0.75), rgba(10, 10, 15, 0.92)), 
                        url('image_0.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Realistic TV Hardware Bezel Frame */
        .tv-frame {
            width: 1020px;
            height: 600px;
            background-color: #121215;
            border-radius: 20px;
            border: 6px solid #2a2a35;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.9), 
                        inset 0 0 20px rgba(0, 0, 0, 0.8),
                        0 0 40px rgba(0, 168, 225, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background-image: linear-gradient(135deg, rgba(15,15,20,0.85), rgba(25,25,35,0.9)), 
                              url('image_0.png');
            background-size: cover;
            background-position: center;
        }

        /* TV Stand Base */
        .tv-stand-neck {
            width: 120px;
            height: 25px;
            background: linear-gradient(to bottom, #2a2a35, #1a1a22);
            margin: 0 auto;
        }
        .tv-stand-base {
            width: 300px;
            height: 12px;
            background: linear-gradient(to bottom, #3a3a45, #1f1f28);
            border-radius: 6px;
            margin: 0 auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
        }

        /* TV Power LED Indicator */
        .tv-led {
            position: absolute;
            bottom: 12px;
            right: 30px;
            width: 6px;
            height: 6px;
            background-color: #00a8e1;
            border-radius: 50%;
            box-shadow: 0 0 8px #00a8e1;
        }

        /* Cinematic Header Styling */
        .app-header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.8rem;
            margin: 0 0 6px 0;
            background: linear-gradient(90deg, #ffffff, #00a8e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 5px 20px rgba(0, 168, 225, 0.3);
            letter-spacing: 1px;
        }
        #status {
            font-size: 1rem;
            color: #8ab4f8;
            background: rgba(0, 168, 225, 0.1);
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(0, 168, 225, 0.2);
            display: inline-block;
        }

        /* TV Menu Layout */
        .menu {
            display: flex;
            gap: 25px;
        }
        .card, .trivia-btn {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.08);
            padding: 35px 40px;
            font-size: 1.3rem;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            color: white;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        /* Premium TV Focus Ring & Glow */
        .card:focus, .trivia-btn:focus, .back-btn:focus {
            border-color: var(--primary-blue);
            background-color: rgba(0, 168, 225, 0.25);
            transform: scale(1.08) translateY(-4px);
            box-shadow: 0 0 30px var(--accent-glow), 0 20px 40px rgba(0,0,0,0.8);
            outline: none;
        }

        /* Main TV Glass Container */
        .tv-container {
            width: 880px;
            background: rgba(18, 18, 24, 0.92);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 18px;
            border: 1px solid rgba(0, 168, 225, 0.3);
            box-shadow: 0 25px 60px rgba(0,0,0,0.85);
            text-align: center;
        }
        .tv-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }
        .tv-badge {
            background: linear-gradient(135deg, #00a8e1, #0077a3);
            color: white;
            padding: 3px 10px;
            font-size: 0.7rem;
            font-weight: bold;
            border-radius: 6px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .trivia-options {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }
        .back-btn {
            margin-top: 15px;
            padding: 8px 22px;
            font-size: 0.95rem;
            background-color: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--primary-blue);
            border-radius: 10px;
            cursor: pointer;
            color: white;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body>

    <!-- TV Hardware Frame -->
    <div>
        <div class="tv-frame">
            <div class="tv-led"></div>

            <div class="app-header">
                <h1>PrimeStream TV</h1>
                <div id="status">Use arrow keys to navigate, press Enter to select</div>
            </div>

            <div class="menu" id="main-menu">
                <div class="card" tabindex="0" autofocus onclick="selectItem('Watch Live Stream')">Watch Live Stream</div>
                <div class="card" tabindex="0" onclick="selectItem('Interactive Trivia')">Interactive Trivia</div>
                <div class="card" tabindex="0" onclick="selectItem('Settings')">Settings</div>
            </div>
        </div>
        <div class="tv-stand-neck"></div>
        <div class="tv-stand-base"></div>
    </div>

    <script>
        const quizQuestions = [
            {
                question: "Which AWS service is best known for serverless compute?",
                options: ["Amazon EC2", "AWS Lambda", "Amazon S3"],
                correctIndex: 1
            },
            {
                question: "What primary input style is designed for Fire TV '10-Foot UI' apps?",
                options: ["Directional D-Pad & Remote", "Touch Screen Swipe", "Mouse Cursor"],
                correctIndex: 0
            },
            {
                question: "Which feature provides instant contextual metadata during Prime Video streaming?",
                options: ["AWS CloudWatch", "FireOS Launcher", "Prime Video X-Ray"],
                correctIndex: 2
            },
            {
                question: "What is the primary display resolution supported by modern Fire TV 4K devices?",
                options: ["1080p Full HD", "3840 x 2160 (4K UHD)", "720p HD"],
                correctIndex: 1
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        function selectItem(featureName) {
            const frame = document.querySelector('.tv-frame');
            if (featureName === 'Watch Live Stream') {
                frame.innerHTML = `
                    <div class="tv-led"></div>
                    <div class="app-header" style="margin-bottom: 10px;">
                        <h1>PrimeStream TV</h1>
                    </div>
                    <div class="tv-container" style="padding: 15px;">
                        <div class="tv-nav">
                            <span style="font-size: 1rem; font-weight: bold; color: #ffffff;">prime video <span style="color: var(--primary-blue); font-size: 0.85rem;">| 4K HDR STREAM</span></span>
                            <span class="tv-badge" style="background: #e74c3c;">● LIVE</span>
                        </div>
                        <video id="live-video" width="100%" height="260" controls autoplay style="border-radius: 10px; border: 2px solid var(--primary-blue); box-shadow: 0 10px 30px rgba(0,0,0,0.7);">
                            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                            Your browser does not support HTML video.
                        </video>
                        <div style="margin-top: 8px; text-align: left;">
                            <h2 id="channel-title" style="margin: 0 0 2px 0; font-size: 1.2rem; color: #fff;">Channel 1: Big Buck Bunny Main Feed</h2>
                            <p id="channel-desc" style="margin: 0; color: #aaa; font-size: 0.85rem;">Streaming in Ultra HD with Dolby Atmos audio mapping.</p>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                            <div style="display: flex; gap: 8px;">
                                <button class="trivia-btn" style="padding: 6px 12px; font-size: 0.85rem;" tabindex="0" autofocus onclick="changeChannel('https://www.w3schools.com/html/mov_bbb.mp4', 'Channel 1: Big Buck Bunny Main Feed', 'Streaming in Ultra HD with Dolby Atmos audio mapping.')">Main Feed</button>
                                <button class="trivia-btn" style="padding: 6px 12px; font-size: 0.85rem;" tabindex="0" onclick="changeChannel('https://www.w3schools.com/html/movie.mp4', 'Channel 2: Cinematic Movie Trailer', 'Exclusive preview reel showcasing dynamic streaming codecs.')">Movie Trailer</button>
                                <button class="trivia-btn" style="padding: 6px 12px; font-size: 0.85rem;" tabindex="0" onclick="changeChannel('https://www.w3schools.com/html/mov_bbb.mp4', 'Channel 3: AWS Cloud Keynote', 'Live architectural walkthrough of cloud-backed television apps.')">AWS Keynote</button>
                            </div>
                            <button onclick="location.reload()" class="back-btn" style="margin-top:0;" tabindex="0">Back to Menu</button>
                        </div>
                    </div>
                `;
            } else if (featureName === 'Interactive Trivia') {
                currentQuestionIndex = 0;
                score = 0;
                renderQuizQuestion();
            } else if (featureName === 'Settings') {
                frame.innerHTML = `
                    <div class="tv-led"></div>
                    <div class="app-header" style="margin-bottom: 10px;">
                        <h1>PrimeStream TV</h1>
                    </div>
                    <div class="tv-container" style="max-width: 720px; padding: 15px;">
                        <div class="tv-nav">
                            <span style="font-size: 1rem; font-weight: bold; color: #ffffff;">fire tv <span style="color: var(--primary-blue); font-size: 0.85rem;">| SYSTEM PREFERENCES</span></span>
                            <span class="tv-badge">CONFIG</span>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 8px; text-align: left; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px; margin-top: 5px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem;">
                                <span>Active User Profile:</span>
                                <button class="trivia-btn" style="padding: 5px 14px; font-size: 0.85rem;" tabindex="0" autofocus onclick="toggleSetting(this, ['Indira (Owner)', 'Developer Pro', 'Family Guest', 'Kids Safe'])">Indira (Owner)</button>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem;">
                                <span>Streaming Quality:</span>
                                <button class="trivia-btn" style="padding: 5px 14px; font-size: 0.85rem;" tabindex="0" onclick="toggleSetting(this, ['4K Ultra HD', '1080p HD', '720p'])">4K Ultra HD</button>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem;">
                                <span>Audio Language:</span>
                                <button class="trivia-btn" style="padding: 5px 14px; font-size: 0.85rem;" tabindex="0" onclick="toggleSetting(this, ['English (Original)', 'Telugu', 'Spanish', 'French'])">English (Original)</button>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem;">
                                <span>Closed Captions (CC):</span>
                                <button class="trivia-btn" style="padding: 5px 14px; font-size: 0.85rem;" tabindex="0" onclick="toggleSetting(this, ['Off', 'On (English)', 'On (Telugu)'])">Off</button>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem;">
                                <span>Parental Controls:</span>
                                <button class="trivia-btn" style="padding: 5px 14px; font-size: 0.85rem;" tabindex="0" onclick="toggleSetting(this, ['Unlocked', 'PIN Protected'])">Unlocked</button>
                            </div>
                        </div>
                        <div style="text-align: right; margin-top: 10px;">
                            <button onclick="location.reload()" class="back-btn" style="margin-top:0;" tabindex="0">Back to Menu</button>
                        </div>
                    </div>
                `;
            }
        }

        function renderQuizQuestion() {
            const frame = document.querySelector('.tv-frame');
            const currentQ = quizQuestions[currentQuestionIndex];
            frame.innerHTML = `
                <div class="tv-led"></div>
                <div class="app-header" style="margin-bottom: 10px;">
                    <h1>PrimeStream TV</h1>
                </div>
                <div class="tv-container" style="padding: 20px;">
                    <div class="tv-nav">
                        <span style="font-size: 1rem; font-weight: bold; color: #ffffff;">prime video <span style="color: var(--primary-blue); font-size: 0.85rem;">| X-RAY TRIVIA</span></span>
                        <span class="tv-badge">QUESTION ${currentQuestionIndex + 1} OF ${quizQuestions.length}</span>
                    </div>
                    <h2 style="color: #fff; font-size: 1.5rem; margin-top: 10px;">Fire TV Pop Quiz</h2>
                    <p style="font-size: 1.1rem; color: #ddd; margin-top: 8px;">${currentQ.question}</p>
                    <div class="trivia-options">
                        ${currentQ.options.map((opt, idx) => `
                            <button class="trivia-btn" style="padding: 14px 20px; font-size: 0.9rem;" tabindex="0" ${idx === 0 ? 'autofocus' : ''} onclick="handleAnswer(${idx})">${opt}</button>
                        `).join('')}
                    </div>
                    <p id="trivia-result" style="font-size: 1rem; margin-top: 15px; height: 20px; font-weight: bold;"></p>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                        <span style="color: var(--primary-blue); font-weight: bold; font-size: 0.95rem;">Score: ${score}</span>
                        <button onclick="location.reload()" class="back-btn" tabindex="0">Back to Menu</button>
                    </div>
                </div>
            `;
        }

        function handleAnswer(selectedIndex) {
            const currentQ = quizQuestions[currentQuestionIndex];
            const resultP = document.getElementById('trivia-result');
            
            if (selectedIndex === currentQ.correctIndex) {
                score++;
                resultP.innerText = "✓ Correct!";
                resultP.style.color = "#2ecc71";
            } else {
                resultP.innerText = "✗ Incorrect!";
                resultP.style.color = "#e74c3c";
            }

            const buttons = document.querySelectorAll('.trivia-options button');
            buttons.forEach(b => b.disabled = true);

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < quizQuestions.length) {
                    renderQuizQuestion();
                } else {
                    renderFinalScore();
                }
            }, 1200);
        }

        function renderFinalScore() {
            const frame = document.querySelector('.tv-frame');
            frame.innerHTML = `
                <div class="tv-led"></div>
                <div class="app-header" style="margin-bottom: 10px;">
                    <h1>PrimeStream TV</h1>
                </div>
                <div class="tv-container" style="padding: 25px;">
                    <div class="tv-nav">
                        <span style="font-size: 1rem; font-weight: bold; color: #ffffff;">prime video <span style="color: var(--primary-blue); font-size: 0.85rem;">| X-RAY TRIVIA</span></span>
                        <span class="tv-badge">COMPLETED</span>
                    </div>
                    <h2 style="color: #2ecc71; font-size: 1.8rem; margin-top: 15px;">Quiz Completed!</h2>
                    <p style="font-size: 1.3rem; color: #fff; margin-top: 10px;">Your Final Score: <strong style="color: var(--primary-blue);">${score} / ${quizQuestions.length}</strong></p>
                    <div style="display: flex; gap: 15px; justify-content: center; margin-top: 20px;">
                        <button onclick="selectItem('Interactive Trivia')" class="trivia-btn" style="padding: 10px 22px; font-size: 0.95rem;" tabindex="0" autofocus>Play Again</button>
                        <button onclick="location.reload()" class="back-btn" style="margin-top:0;" tabindex="0">Back to Menu</button>
                    </div>
                </div>
            `;
        }

        function changeChannel(videoSrc, title, desc) {
            const videoElem = document.getElementById('live-video');
            const titleElem = document.getElementById('channel-title');
            const descElem = document.getElementById('channel-desc');
            
            videoElem.src = videoSrc;
            videoElem.play();
            titleElem.innerText = title;
            descElem.innerText = desc;
        }

        function toggleSetting(btn, options) {
            let currentIndex = options.indexOf(btn.innerText);
            let nextIndex = (currentIndex + 1) % options.length;
            btn.innerText = options[nextIndex];
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                const focusedElement = document.activeElement;
                if (focusedElement && (focusedElement.classList.contains('card') || focusedElement.classList.contains('trivia-btn') || focusedElement.classList.contains('back-btn'))) {
                    focusedElement.click();
                }
            }
        });
    </script>

</body>
</html>
